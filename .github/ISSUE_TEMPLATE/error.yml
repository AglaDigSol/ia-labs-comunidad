name: Error
description: Algo no funciona o da un resultado incorrecto.
title: "[Error] "
labels: ["error"]
body:
  - type: textarea
    id: que
    attributes:
      label: Qué ha pasado
      description: Qué esperabas y qué ocurrió. Si es un cálculo, incluye la entrada exacta (fórmula, matriz…).
    validations:
      required: true
  - type: textarea
    id: pasos
    attributes:
      label: Pasos para reproducirlo
      placeholder: "1. Abre Laboratorios → Lógica\n2. Escribe…"
  - type: input
    id: entorno
    attributes:
      label: Navegador y dispositivo
      placeholder: "Safari 26 en iPad"
  - type: checkboxes
    id: privacidad
    attributes:
      label: Privacidad
      options:
        - label: No incluyo datos personales ni enunciados de actividades evaluables.
          required: true
