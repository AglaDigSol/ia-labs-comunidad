name: Nuevo símbolo
description: Propón un símbolo para el diccionario de simbología.
title: "[Símbolo] "
labels: ["contenido", "simbología"]
body:
  - type: input
    id: simbolo
    attributes:
      label: Símbolo y nombre
      placeholder: "∇ · gradiente"
    validations:
      required: true
  - type: input
    id: tex
    attributes:
      label: TeX
      placeholder: "\\nabla f"
  - type: textarea
    id: lectura
    attributes:
      label: Cómo se lee en clase
      description: Escríbelo con palabras, como lo dirías en voz alta.
    validations:
      required: true
  - type: textarea
    id: python
    attributes:
      label: Equivalente en Python o NumPy (opcional)
      render: python
  - type: checkboxes
    id: integridad
    attributes:
      label: Integridad
      options:
        - label: No copio texto de diapositivas, guías ni enunciados del curso.
          required: true
