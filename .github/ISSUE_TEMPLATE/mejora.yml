name: Mejora
description: Propón una mejora o un laboratorio nuevo.
title: "[Mejora] "
labels: ["mejora"]
body:
  - type: textarea
    id: problema
    attributes:
      label: Qué problema resuelve
    validations:
      required: true
  - type: textarea
    id: propuesta
    attributes:
      label: Propuesta
      description: Recuerda el principio del proyecto, «comprobar y entrenar, no resolver».
  - type: checkboxes
    id: integridad
    attributes:
      label: Integridad
      options:
        - label: La propuesta no sirve para resolver actividades evaluables.
          required: true
