name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run typecheck
      - name: Consumidor de la API (solo importa de "ia-labs-comunidad")
        run: npm run typecheck:consumer
      - run: npx vitest run
      - run: npm run build
      - name: Tamaño de dist/
        run: du -sh dist

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            tools/lint/package-lock.json
      - run: npm ci --ignore-scripts
      - run: npm run lint:install
      - run: npm run lint

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm audit --omit=dev --audit-level=high

  gitleaks:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Descargar gitleaks (release oficial, con checksum)
        run: |
          set -euo pipefail
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tgz="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$tgz" "$base/$tgz"
          curl -sSfL -o "$RUNNER_TEMP/checksums.txt" "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          (cd "$RUNNER_TEMP" && grep " $tgz\$" checksums.txt | sha256sum -c -)
          tar -xzf "$RUNNER_TEMP/$tgz" -C "$RUNNER_TEMP" gitleaks
      - name: gitleaks sobre todo el historial
        run: '"$RUNNER_TEMP/gitleaks" git --redact --no-banner -v .'

  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: lycheeverse/lychee-action@v2
        with:
          args: >-
            --no-progress
            --accept 200,206,429
            --exclude-path node_modules
            --exclude '^https://github\.com/AglaDigSol/ia-labs-comunidad/(compare|releases)'
            './**/*.md'
          fail: true

  dco:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Todos los commits del PR llevan Signed-off-by
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          missing=0
          for sha in $(git rev-list --no-merges "$BASE..$HEAD"); do
            # Los commits de Dependabot no pueden firmarse con DCO.
            if [ "$(git log -1 --format='%ae' "$sha")" = "49699333+dependabot[bot]@users.noreply.github.com" ]; then
              continue
            fi
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "$sha" | grep -q .; then
              echo "::error::El commit $sha no lleva Signed-off-by (usa git commit -s)."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "Firma los commits con: git rebase --signoff $BASE && git push --force-with-lease"
            exit 1
          fi
          echo "DCO correcto."
