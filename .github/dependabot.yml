version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    ignore:
      # Pyodide 0.27.x es la última línea con Python 3.12; subirla exige regenerar el manifiesto (MAINTAINING.md).
      - dependency-name: pyodide
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint necesita la API JS de TypeScript ≤ 6.0; TypeScript 7 no la tiene.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      lint:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
