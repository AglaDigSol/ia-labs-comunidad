version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    groups:
      npm:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /tools/lint
    schedule:
      interval: monthly
    ignore:
      # typescript-eslint necesita la API JS de TypeScript ≤ 6.0; TypeScript 7 no la tiene.
      - dependency-name: typescript
        versions: [">=6.1.0"]
    groups:
      lint:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      github-actions:
        patterns: ["*"]
