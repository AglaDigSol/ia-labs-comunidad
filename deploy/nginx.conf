# nginx para servir dist/ (imagen Docker o servidor propio). Sin COEP: no hace falta.
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/calendar;

    # Calendarios suscribibles: text/calendar y caché corta (1 h).
    location ~ ^/calendario[A-Za-z0-9-]*\.ics$ {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type "text/calendar; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /calendario.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Ficheros con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fallback SPA: cualquier ruta sin fichero sirve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
