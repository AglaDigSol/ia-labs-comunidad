# nginx para servir dist/ (imagen Docker o servidor propio). Sin COEP: no hace falta (con la pestaña
# Python, COEP require-corp es opcional: ver «Python (opcional)» en el README).
server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    server_tokens off;
    charset utf-8;
    gzip on;
    gzip_types text/css application/javascript text/javascript application/json image/svg+xml text/calendar application/wasm;

    # Calendarios suscribibles: text/calendar y caché corta (1 h).
    location ~ ^/calendario[A-Za-z0-9-]*\.ics$ {
        include /etc/nginx/snippets/security-headers.conf;
        types { }
        default_type "text/calendar; charset=utf-8";
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    location = /calendario.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=3600" always;
        try_files $uri =404;
    }

    # Worker de la pestaña Python (solo con LABS_PYTHON=1): Pyodide compila WebAssembly dentro del
    # worker, que tiene su propia CSP (la de esta respuesta) con 'wasm-unsafe-eval'. La del documento no
    # cambia. Una location con expresión regular gana a la de prefijo /assets/.
    location ~ ^/assets/py\.worker-[A-Za-z0-9_-]+\.js$ {
        include /etc/nginx/snippets/security-headers-wasm.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # Pyodide (solo con LABS_PYTHON=1): la carpeta lleva la versión y los wheels su versión en el
    # nombre, así que la caché es larga e inmutable; el lock recortado, 1 h. Tipos explícitos:
    # application/wasm permite compilar mientras descarga.
    location /pyodide/ {
        include /etc/nginx/snippets/security-headers.conf;
        types {
            application/wasm wasm;
            application/javascript js;
            application/json json;
            application/zip whl zip;
        }
        default_type application/octet-stream;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;

        location ~ \.json$ {
            include /etc/nginx/snippets/security-headers.conf;
            add_header Cache-Control "public, max-age=3600" always;
            try_files $uri =404;
        }
    }

    # Ficheros con hash en el nombre: caché larga e inmutable.
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    location = /index.html {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # Fallback SPA: cualquier ruta sin fichero sirve index.html.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
