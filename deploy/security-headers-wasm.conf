# Cabeceras del worker de Python (assets/py.worker-*.js), solo con la pestaña Python (LABS_PYTHON=1).
# Iguales que security-headers.conf salvo script-src, que añade 'wasm-unsafe-eval': un worker
# dedicado tiene su propia CSP, la de la respuesta de su script, y Pyodide compila WebAssembly ahí.
# 'wasm-unsafe-eval' solo permite compilar WebAssembly (no eval de JavaScript) y el documento sigue
# con script-src 'self'.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self'; style-src-elem 'self'; style-src-attr 'unsafe-inline'; img-src 'self'; font-src 'self'; connect-src 'self'; manifest-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header Referrer-Policy "no-referrer" always;
add_header Permissions-Policy "accelerometer=(), camera=(), geolocation=(), gyroscope=(), magnetometer=(), microphone=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
add_header X-Frame-Options "DENY" always;
add_header X-Robots-Tag "noindex, nofollow" always;
